services:
  res:
    image: ${RES_IMAGE:-chile-res:local}
    build:
      context: .
      dockerfile: Dockerfile.res
    init: true
    security_opt:
      - seccomp=docker/chrome-seccomp.json
    restart: "no"
    shm_size: ${RES_SHM_SIZE:-2gb}
    mem_limit: ${RES_MEMORY_LIMIT:-12g}
    cpus: ${RES_CPUS:-6}
    pids_limit: ${RES_PIDS_LIMIT:-4096}
    stop_signal: SIGINT
    stop_grace_period: 1m
    environment:
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      PROXY_REPUTATION_MODE: ${PROXY_REPUTATION_MODE:-strict}
      PROXY_REPUTATION_SCORE_LIMIT: ${PROXY_REPUTATION_SCORE_LIMIT:-25}
      PROXY_REPUTATION_MAX_REPORTS: ${PROXY_REPUTATION_MAX_REPORTS:-0}
      PROXY_REPUTATION_CACHE_HOURS: ${PROXY_REPUTATION_CACHE_HOURS:-6}
      PROXY_BLOCKLIST_REFRESH_HOURS: ${PROXY_BLOCKLIST_REFRESH_HOURS:-24}
      PROXY_BLOCKLIST_MAX_AGE_HOURS: ${PROXY_BLOCKLIST_MAX_AGE_HOURS:-48}
      PROXY_THREAT_REFRESH_HOURS: ${PROXY_THREAT_REFRESH_HOURS:-6}
      PROXY_THREAT_MAX_AGE_HOURS: ${PROXY_THREAT_MAX_AGE_HOURS:-12}
      PROXY_THREAT_CACHE: ${PROXY_THREAT_CACHE:-data/threat-feeds}
      ALLOW_PUBLIC_PROXY_COLLECTION: "0"
      BRIGHTDATA_PROXY_SERVER: ${BRIGHTDATA_PROXY_SERVER:-http://brd.superproxy.io:44445}
      BRIGHTDATA_PROXY_USERNAME: ${BRIGHTDATA_PROXY_USERNAME:-}
      BRIGHTDATA_PROXY_PASSWORD: ${BRIGHTDATA_PROXY_PASSWORD:-}
      WEBSHARE_API_TOKEN: ${WEBSHARE_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RES_TELEGRAM_INTERVAL_MINUTES: ${RES_TELEGRAM_INTERVAL_MINUTES:-5}
      RES_AUDIO_THREADS: ${RES_AUDIO_THREADS:-2}
      RES_RETRY_ERRORS: ${RES_RETRY_ERRORS:-0}
    volumes:
      - type: bind
        source: ${RES_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
    command:
      - benchmark
      - --year
      - "${RES_YEAR:-2025}"
      - --month
      - "${RES_MONTH:-1}"
      - --limit
      - "${RES_LIMIT:-100}"
      - --run-id
      - "${RES_RUN_ID:-res-2025-01-100}"
      - --output
      - data/res-benchmark
      - --browsers
      - "${RES_BROWSERS:-2}"
      - --proxy-provider
      - "${RES_PROXY_PROVIDER:-brightdata}"
      - --max-documents
      - "${RES_MAX_DOCUMENTS:-0}"
      - --proxy-sessions
      - "${RES_PROXY_SESSIONS:-0}"
      - --tokens-per-proxy
      - "${RES_TOKENS_PER_PROXY:-20}"
      - --company-attempts
      - "${RES_COMPANY_ATTEMPTS:-2}"
      - --max-failures
      - "${RES_MAX_FAILURES:-20}"
      - --error-cooldown-minutes
      - "${RES_ERROR_COOLDOWN_MINUTES:-10}"
      - --max-cooldowns
      - "${RES_MAX_COOLDOWNS:-3}"
      - --timeout
      - "${RES_TIMEOUT:-40}"
      - --captcha-timeout
      - "${RES_CAPTCHA_TIMEOUT:-130}"
      - --delay
      - "${RES_DELAY:-3}"
      - --checkpoint-seconds
      - "${RES_CHECKPOINT_INTERVAL:-15}"
      - --telegram-minutes
      - "${RES_TELEGRAM_INTERVAL_MINUTES:-5}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
