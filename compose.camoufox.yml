services:
  pep-camoufox:
    image: pep-camoufox:test
    build:
      context: .
      dockerfile: Dockerfile.camoufox
    init: true
    restart: "no"
    shm_size: ${PEP_SHM_SIZE:-2gb}
    mem_limit: ${PEP_MEMORY_LIMIT:-8g}
    cpus: ${PEP_CPUS:-4}
    pids_limit: 1024
    stop_signal: SIGINT
    stop_grace_period: 1m
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BRIGHTDATA_PROXY_SERVER: ${BRIGHTDATA_PROXY_SERVER:-http://brd.superproxy.io:44445}
      BRIGHTDATA_PROXY_USERNAME: ${BRIGHTDATA_PROXY_USERNAME:-}
      BRIGHTDATA_PROXY_PASSWORD: ${BRIGHTDATA_PROXY_PASSWORD:-}
    volumes:
      - type: bind
        source: ${PEP_INPUT:-./docs/DECLARACIONES_PEP.xlsx}
        target: /input/DECLARACIONES_PEP.xlsx
        read_only: true
        bind:
          create_host_path: false
      - pep-camoufox-data:/app/data
    command:
      - /input/DECLARACIONES_PEP.xlsx
      - --limit
      - "${PEP_LIMIT:-100}"
      - --offset
      - "${PEP_OFFSET:-0}"
      - --timeout
      - "${PEP_TIMEOUT:-60}"
      - --max-minutes
      - "${PEP_MAX_MINUTES:-120}"
      - --workers
      - "${PEP_WORKERS:-4}"
      - --log-interval
      - "${PEP_LOG_INTERVAL:-30}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pep-camoufox-data:
