# docker compose --env-file .env.res -f compose.res.yml -f compose.res.bulk.yml up
services:
  res:
    image: chile-res:bulk
    restart: unless-stopped
    build:
      args:
        CAMOUFOX_ASSETS: none
    command:
      - bulk-continuous
      - --start
      - "${RES_CONTINUOUS_FROM_DATE:-2013-01-01}"
      - --db
      - "data/res-bulk/${RES_CONTINUOUS_RUN_ID:-res-continuous}/tracking.sqlite3"
      - --run-id
      - "${RES_CONTINUOUS_RUN_ID:-res-continuous}"
      - --kind
      - "${RES_BULK_KIND:-action}"
      - --providers
      - "${RES_CONTINUOUS_PROVIDERS:-webshare,brightdata,residential}"
      - --batch-size
      - "${RES_BULK_BATCH_SIZE:-0}"
      - --captcha-timeout
      - "${RES_CAPTCHA_TIMEOUT:-130}"
      - --workers
      - "${RES_BULK_WORKERS:-4}"
      - --interval
      - "${RES_BULK_INTERVAL:-0.1}"
      - --telegram-minutes
      - "${RES_TELEGRAM_INTERVAL_MINUTES:-5}"
      - --quota-hours
      - "${RES_BULK_QUOTA_HOURS:-24}"
      - --network-retry-seconds
      - "${RES_BULK_NETWORK_RETRY_SECONDS:-10}"
