# Stages 1–3. Paths are relative to the current working directory.
[selection]
year = 2025
months = ["1"]

[storage]
output = "data/dequienes-companies-2025"
profile = "data/dequienes-companies-profile"

[public]
transport = "hybrid"
session_refreshes = 2
max_items = 20
browsers = 1
tabs_per_browser = 2
max_in_flight = 4
rate_per_minute = 60
delay_seconds = 0.3
timeout_seconds = 45
max_attempts = 3
lease_seconds = 180
retry_seconds = 30
proxy_mode = "direct"

# These limits will be consumed when the corresponding workers are implemented.
# Queues are already populated, but no account/RES browser is launched here.
[account]
max_items = 5
browsers = 1
tabs_per_browser = 1
max_in_flight = 1

[res]
max_items = 5
browsers = 1
tabs_per_browser = 1
max_in_flight = 1
